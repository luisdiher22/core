# Quality Scale Compliance Tracking for Runaway Pet Protection Integration
#
# This file tracks compliance with Home Assistant's Integration Quality Scale rules.
# The quality scale ensures integrations meet increasing standards of quality and reliability.
#
# Quality Scale Tiers:
# - Bronze: Basic requirements (ALL rules must be met)
# - Silver: Enhanced functionality
# - Gold: Advanced features
# - Platinum: Highest quality standards
#
# Rule Status Options:
# - done: Rule is fully implemented
# - todo: Rule needs to be implemented
# - exempt: Rule doesn't apply to this integration (with explanation)
#
# This integration currently targets Bronze tier compliance.

rules:
  # Bronze Tier Rules (ALL REQUIRED)
  action-setup:
    status: exempt
    comment: Integration does not register service actions.
  appropriate-polling:
    status: exempt
    comment: Integration uses event-driven state changes, no polling needed.
  brands:
    status: exempt
    comment: Integration is a helper type and doesn't represent a physical device brand.
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: Integration does not register service actions.
  docs-high-level-description:
    status: exempt
    comment: Helper integration, documentation is included in strings.json.
  docs-installation-instructions:
    status: exempt
    comment: Helper integration, standard Home Assistant integration installation applies.
  docs-removal-instructions:
    status: exempt
    comment: Helper integration, standard Home Assistant integration removal applies.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: todo
  config-entry-unloading: todo
  docs-configuration-parameters: todo
  docs-installation-parameters: todo
  entity-unavailable: todo
  integration-owner: todo
  log-when-unavailable: todo
  parallel-updates: todo
  reauthentication-flow: todo
  test-coverage: todo

  # Gold
  devices: todo
  diagnostics: todo
  discovery-update-info: todo
  discovery: todo
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices: todo
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices: todo
  entity-category: todo
  entity-device-class: todo
  entity-disabled-by-default: todo
  entity-translations: todo
  exception-translations: todo
  icon-translations: todo
  reconfiguration-flow: todo
  repair-issues: todo
  stale-devices: todo

  # Platinum
  async-dependency: todo
  inject-websession: todo
  strict-typing: todo
